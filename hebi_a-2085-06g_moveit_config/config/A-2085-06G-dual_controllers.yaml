# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    left_hebi_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_hebi_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_gripper_controller:
      type: position_controllers/GripperActionController
    right_gripper_controller:
      type: position_controllers/GripperActionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

hebi_left_arm_controller:
  ros__parameters:
    joints:
      - left_J1_base
      - left_J2_shoulder
      - left_J3_elbow
      - left_J4_wrist1
      - left_J5_wrist2
      - left_J6_wrist3
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
left_gripper_controller:
  ros__parameters:
    joint: left_end_effector_1/input_l_finger

hebi_right_arm_controller:
  ros__parameters:
    joints:
      - right_J1_base
      - right_J2_shoulder
      - right_J3_elbow
      - right_J4_wrist1
      - right_J5_wrist2
      - right_J6_wrist3
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
left_gripper_controller:
  ros__parameters:
    joint: right_end_effector_1/input_l_finger